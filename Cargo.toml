[package]
name = "tauri-app-ui"
version.workspace = true
edition.workspace = true

[workspace]
members = [
    "hotkey",
    "hotkey-macros",
    "src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["thlstsul"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.29"
scc = "3.7.1"
time = "0.3.47"
reqwest = "0.13.3"
error_set = "0.9.1"

[dependencies]
dioxus-logger = "0.7"
encoding = "0.2.33"
futures-util = "0.3.32"
http = "1.4.0"
mime = "0.3.17"
serde_json = { workspace = true }

[dependencies.dioxus]
features = ["web"]
version = "0.7"

[dependencies.serde]
workspace = true

[dependencies.tauri-sys]
branch = "v2"
features = [
    "core",
    "event",
]
git = "https://github.com/JonasKruckenberg/tauri-sys"

[dependencies.time]
features = [
    "formatting",
    "macros",
    "parsing",
    "serde",
    "wasm-bindgen",
]
workspace = true

[patch.crates-io.tauri]
branch = "device-events"
git = "https://github.com/thlstsul/tauri"

[patch.crates-io.tauri-utils]
branch = "device-events"
git = "https://github.com/thlstsul/tauri"

[patch.crates-io.wry]
branch = "ipc"
git = "https://github.com/thlstsul/wry"

[profile.android-dev]
inherits = "dev"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.server-dev]
inherits = "dev"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
